<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>InternHub — Ứng viên</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%}body{margin:0;background:var(--surface-page)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="CandidateShell.jsx"></script>
<script type="text/babel" src="SearchScreen.jsx"></script>
<script type="text/babel" src="CandidateScreens.jsx"></script>
<script type="text/babel" data-presets="react">
var { SideNav, Button, Toast, Card, Avatar, Icon } = window.InternHubDesignSystem_f6cc55;

var TITLES = { search: "Tìm việc thực tập", saved: "Tin đã lưu", apps: "Hồ sơ đã gửi", messages: "Tin nhắn", profile: "Hồ sơ & CV" };

function App() {
  const [view, setView] = React.useState("search");
  const [savedIds, setSavedIds] = React.useState([1, 5]);
  const [toast, setToast] = React.useState(null);
  const toggleSave = (id) => setSavedIds((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
  const applied = (job) => { setToast({ tone: "success", title: "Đã gửi hồ sơ ứng tuyển", description: job.company + " thường phản hồi trong 5 ngày." }); setTimeout(() => setToast(null), 4200); };

  return (
    <div style={{ display: "flex", minHeight: "100vh" }}>
      <SideNav role="candidate" value={view} onChange={setView} items={NAV} header={<Logo />}
        footer={<Card padding="sm" tone="brand" style={{ display: "grid", gap: "var(--space-2)" }}>
          <span style={{ font: "var(--type-label)", color: "var(--pine-800)" }}>Hồ sơ đạt 80%</span>
          <span style={{ font: "var(--type-body-sm)", color: "var(--pine-700)" }}>Thêm mô tả dự án để nhà tuyển dụng dễ tìm thấy bạn.</span>
          <Button size="sm" variant="secondary" onClick={() => setView("profile")}>Hoàn thiện hồ sơ</Button>
        </Card>} />
      <main style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
        <TopBar title={TITLES[view]} right={view === "search" ? <Button variant="ghost" icon="sliders-horizontal">Bộ lọc đã lưu</Button> : null} />
        <div style={{ flex: 1, minWidth: 0 }}>
          {view === "search" ? <SearchScreen savedIds={savedIds} toggleSave={toggleSave} onApplied={applied} /> : null}
          {view === "saved" ? <SavedScreen savedIds={savedIds} toggleSave={toggleSave} /> : null}
          {view === "apps" ? <AppsScreen /> : null}
          {view === "messages" ? <MessagesScreen /> : null}
          {view === "profile" ? <ProfileScreen /> : null}
        </div>
      </main>
      {toast ? <div style={{ position: "fixed", right: "var(--space-6)", bottom: "var(--space-6)", zIndex: 60 }}><Toast {...toast} onDismiss={() => setToast(null)} /></div> : null}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
