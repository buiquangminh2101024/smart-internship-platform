<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>InternHub — Nhà tuyển dụng</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%}body{margin:0;background:var(--surface-page)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="EmployerShell.jsx"></script>
<script type="text/babel" src="JobScreens.jsx"></script>
<script type="text/babel" src="PeopleScreens.jsx"></script>
<script type="text/babel" data-presets="react">
var { SideNav, Button, Toast, Card, EmptyState } = window.InternHubDesignSystem_f6cc55;
var TITLES = { dash: "Tổng quan", jobs: "Tin tuyển dụng", new: "Tạo tin tuyển dụng", cands: "Ứng viên", messages: "Tin nhắn", company: "Hồ sơ công ty", team: "Thành viên" };

function App() {
  const [view, setView] = React.useState("dash");
  const [toast, setToast] = React.useState(null);
  const act = (title, tone) => { setToast({ tone: tone || "success", title }); setTimeout(() => setToast(null), 3800); };
  return (
    <div style={{ display: "flex", minHeight: "100vh" }}>
      <SideNav role="employer" value={view === "new" ? "jobs" : view} onChange={setView} items={E_NAV} header={<ELogo />}
        footer={<Button variant="ghost" icon="circle-help" fullWidth style={{ justifyContent: "flex-start" }}>Trợ giúp</Button>} />
      <main style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
        <ETopBar title={TITLES[view]} right={view === "jobs" ? <Button variant="secondary" icon="download">Xuất báo cáo</Button> : null} />
        <div style={{ flex: 1, minWidth: 0 }}>
          {view === "dash" ? <DashScreen go={setView} /> : null}
          {view === "jobs" ? <JobsScreen go={setView} onAction={act} /> : null}
          {view === "new" ? <NewJobScreen go={setView} onAction={act} /> : null}
          {view === "cands" ? <CandidatesScreen onAction={act} /> : null}
          {view === "company" || view === "team" ? <CompanyScreen onAction={act} /> : null}
          {view === "messages" ? (
            <div style={{ padding: "var(--space-6)", maxWidth: 720 }}>
              <EmptyState icon="message-square" tone="brand" title="Hộp thư của nhà tuyển dụng"
                description="Cùng một giao diện tin nhắn như phía ứng viên — xem bản mẫu trong UI kit Candidate web app."
                action={<Button variant="secondary" as="a" href="../candidate_web/index.html">Mở bản mẫu tin nhắn</Button>} />
            </div>
          ) : null}
        </div>
      </main>
      {toast ? <div style={{ position: "fixed", right: "var(--space-6)", bottom: "var(--space-6)", zIndex: 60 }}><Toast {...toast} onDismiss={() => setToast(null)} /></div> : null}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
