<!-- @dsCard group="Effects" viewport="700x160" name="Elevation" subtitle="xs rests, md hovers, lg floats, xl is modal-only." -->
<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div class="lg"><div class="rowc" style="gap:18px;padding:6px 0">
  <div style="text-align:center"><div style="width:104px;height:62px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs)"></div><div class="tk" style="margin-top:8px">xs · rest</div></div><div style="text-align:center"><div style="width:104px;height:62px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><div class="tk" style="margin-top:8px">sm · sticky</div></div><div style="text-align:center"><div style="width:104px;height:62px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><div class="tk" style="margin-top:8px">md · hover</div></div><div style="text-align:center"><div style="width:104px;height:62px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><div class="tk" style="margin-top:8px">lg · float</div></div><div style="text-align:center"><div style="width:104px;height:62px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl)"></div><div class="tk" style="margin-top:8px">xl · modal</div></div>
  </div><div class="cap">Shadows are neutral-tinted, never black and never coloured. Cards never nest shadows — use a sunken well instead.</div></div></body></html>
