<!-- @dsCard group="Effects" viewport="700x150" name="Motion" subtitle="120ms controls, 180ms surfaces, 260ms overlays." -->
<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div class="lg">
  <div style="display:flex;align-items:center;gap:12px"><div style="width:108px;height:8px;border-radius:var(--radius-pill);background:var(--pine-400)"></div><span class="tk">--duration-fast · 120ms</span><span class="cap">hover / focus / colour change</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:162px;height:8px;border-radius:var(--radius-pill);background:var(--pine-400)"></div><span class="tk">--duration-base · 180ms</span><span class="cap">card elevation, tab switch, toggle</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:234px;height:8px;border-radius:var(--radius-pill);background:var(--pine-400)"></div><span class="tk">--duration-slow · 260ms</span><span class="cap">dialogs, drawers, toasts entering</span></div>
  <div class="cap">Everything uses --ease-standard cubic-bezier(.2,0,.2,1). Nothing bounces, springs or loops.</div></div></body></html>
