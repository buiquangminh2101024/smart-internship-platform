<!-- @dsCard group="Spacing" viewport="700x150" name="Control heights" subtitle="32 / 40 / 48, with the 44px touch floor." -->
<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Control heights</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div class="lg"><div class="rowc" style="align-items:flex-end">
  <div style="text-align:center"><div style="width:120px;height:var(--control-sm);background:var(--action-primary-bg);color:#fff;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font:var(--type-label)">32px</div><div class="tk" style="margin-top:6px">--control-sm</div></div><div style="text-align:center"><div style="width:120px;height:var(--control-md);background:var(--action-primary-bg);color:#fff;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font:var(--type-label)">40px</div><div class="tk" style="margin-top:6px">--control-md</div></div><div style="text-align:center"><div style="width:120px;height:var(--control-lg);background:var(--action-primary-bg);color:#fff;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font:var(--type-label)">48px</div><div class="tk" style="margin-top:6px">--control-lg</div></div>
  <div style="text-align:center"><div style="width:120px;height:var(--touch-min);background:var(--marigold-50);border:1px dashed var(--marigold-300);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font:var(--type-meta);color:var(--marigold-600)">44px</div><div class="tk" style="margin-top:6px">--touch-min</div></div>
  </div><div class="cap">Desktop default is 40px. On mobile surfaces every tap target grows to at least 44px.</div></div></body></html>
