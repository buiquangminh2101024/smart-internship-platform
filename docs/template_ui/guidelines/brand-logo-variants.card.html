<!-- @dsCard group="Brand" viewport="700x200" name="Logo — mark, wordmark, inverse" subtitle="Every approved variant." -->
<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Logo — mark, wordmark, inverse</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div style="display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center">
  <div style="display:flex;align-items:center;justify-content:center;height:78px;border:1px solid var(--border-subtle);border-radius:var(--radius-md)"><img src="../assets/logo-mark.svg" alt="" style="height:52px"></div>
  <div style="display:flex;align-items:center;height:78px;padding:0 16px;border:1px solid var(--border-subtle);border-radius:var(--radius-md)"><img src="../assets/logo-wordmark.svg" alt="" style="height:34px"></div>
  <div style="display:flex;align-items:center;justify-content:center;height:78px;border-radius:var(--radius-md);background:var(--surface-brand-deep);color:var(--pine-100)"><img src="../assets/logo-mark-white.svg" alt="" style="height:52px"></div>
  <div style="display:flex;align-items:center;height:78px;padding:0 16px;border-radius:var(--radius-md);background:var(--surface-brand-deep)"><img src="../assets/logo-full-inverse.svg" alt="" style="height:56px"></div>
  </div></body></html>
