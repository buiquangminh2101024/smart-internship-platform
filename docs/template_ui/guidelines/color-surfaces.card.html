<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Surfaces & borders</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
  <div style="background:var(--surface-page);color:var(--text-body);border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:86px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end"><div style="font:var(--type-label)">page</div><div class="tk" style="color:inherit;opacity:.65">--surface-page</div></div><div style="background:var(--surface-card);color:var(--text-body);border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:86px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end"><div style="font:var(--type-label)">card</div><div class="tk" style="color:inherit;opacity:.65">--surface-card</div></div><div style="background:var(--surface-sunken);color:var(--text-body);border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:86px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end"><div style="font:var(--type-label)">sunken</div><div class="tk" style="color:inherit;opacity:.65">--surface-sunken</div></div><div style="background:var(--surface-brand-soft);color:var(--pine-800);border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:86px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end"><div style="font:var(--type-label)">brand-soft</div><div class="tk" style="color:inherit;opacity:.65">--surface-brand-soft</div></div><div style="background:var(--surface-brand-deep);color:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:86px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end"><div style="font:var(--type-label)">brand-deep</div><div class="tk" style="color:inherit;opacity:.65">--surface-brand-deep</div></div>
  </div><div class="cap" style="margin-top:10px">Cards are white on a --surface-page well. Brand-deep is reserved for the marketing hero and the app's signed-out shell.</div></body></html>
