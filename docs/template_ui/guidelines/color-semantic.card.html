<!-- @dsCard group="Colors" viewport="700x160" name="Semantic feedback" subtitle="Success, warning, danger, info — soft fill + ink pairs." -->
<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Semantic feedback</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div class="lg"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
  <div style="background:var(--feedback-success-soft);border-radius:var(--radius-md);padding:10px 12px"><div style="font:var(--type-label);color:var(--feedback-success)">Success</div><div class="tk">var(--feedback-success)</div></div><div style="background:var(--feedback-warning-soft);border-radius:var(--radius-md);padding:10px 12px"><div style="font:var(--type-label);color:var(--feedback-warning)">Warning</div><div class="tk">var(--feedback-warning)</div></div><div style="background:var(--feedback-danger-soft);border-radius:var(--radius-md);padding:10px 12px"><div style="font:var(--type-label);color:var(--feedback-danger)">Danger</div><div class="tk">var(--feedback-danger)</div></div><div style="background:var(--feedback-info-soft);border-radius:var(--radius-md);padding:10px 12px"><div style="font:var(--type-label);color:var(--feedback-info)">Info</div><div class="tk">var(--feedback-info)</div></div>
  </div><div class="cap">Warning shares the Marigold ramp — a colour that means "a human still has to look at this".</div></div></body></html>
