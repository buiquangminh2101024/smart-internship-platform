<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Layout in use</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;display:flex;height:130px">
  <div style="width:var(--sidenav-w);background:var(--surface-card);box-shadow:inset 3px 0 0 var(--role-candidate);border-right:1px solid var(--border-subtle);padding:10px;font:var(--type-meta);color:var(--text-muted)">--sidenav-w 248</div>

    <div style="flex:1;padding:var(--space-6);display:flex;gap:var(--space-6)"><div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg)"></div><div style="width:180px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg)"></div></div>
  </div></div><div class="cap" style="margin-top:10px">--layout-gutter 24px between panels; prose caps at --layout-prose 68ch.</div></body></html>
