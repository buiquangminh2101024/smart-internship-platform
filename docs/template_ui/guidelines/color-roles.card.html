<!-- @dsCard group="Colors" viewport="700x170" name="Actor roles" subtitle="Candidate = Pine, Employer = Indigo, Admin = Plum." -->
<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Actor roles</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div class="lg"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
  <div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:44px;background:var(--role-candidate)"></div><div style="background:var(--role-candidate-soft);padding:8px"><div style="font:var(--type-label);color:var(--role-candidate-ink)">Candidate</div><div class="tk">var(--role-candidate)</div></div></div><div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:44px;background:var(--role-employer)"></div><div style="background:var(--role-employer-soft);padding:8px"><div style="font:var(--type-label);color:var(--role-employer-ink)">Employer</div><div class="tk">var(--role-employer)</div></div></div><div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:44px;background:var(--role-admin)"></div><div style="background:var(--role-admin-soft);padding:8px"><div style="font:var(--type-label);color:var(--role-admin-ink)">Admin</div><div class="tk">var(--role-admin)</div></div></div>
  </div><div class="cap">The role tint appears on the SideNav rail, active nav item and RoleBadge — never as a page background.</div></div></body></html>
