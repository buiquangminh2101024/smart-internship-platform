<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="3 · 6 · 8 · 10 · 14 · 20 · pill. 10px is the house card radius." -->
<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Corner radii</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div class="lg"><div class="rowc">
  <div style="text-align:center"><div style="width:64px;height:52px;background:var(--pine-50);border:1px solid var(--pine-200);border-radius:var(--radius-xs)"></div><div class="tk" style="margin-top:6px">xs</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--pine-50);border:1px solid var(--pine-200);border-radius:var(--radius-sm)"></div><div class="tk" style="margin-top:6px">sm</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--pine-50);border:1px solid var(--pine-200);border-radius:var(--radius-md)"></div><div class="tk" style="margin-top:6px">md</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--pine-50);border:1px solid var(--pine-200);border-radius:var(--radius-lg)"></div><div class="tk" style="margin-top:6px">lg</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--pine-50);border:1px solid var(--pine-200);border-radius:var(--radius-xl)"></div><div class="tk" style="margin-top:6px">xl</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--pine-50);border:1px solid var(--pine-200);border-radius:var(--radius-2xl)"></div><div class="tk" style="margin-top:6px">2xl</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--pine-50);border:1px solid var(--pine-200);border-radius:var(--radius-pill)"></div><div class="tk" style="margin-top:6px">pill</div></div>
  </div><div class="cap">Controls --radius-md, cards --radius-lg, modals/hero panels --radius-xl. Pill only on status pills and avatars.</div></div></body></html>
