<!-- @dsCard group="Colors" viewport="700x150" name="Job-post lifecycle" subtitle="draft → review → published → closed / expired / taken down." -->
<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Job-post lifecycle</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div class="lg"><div class="rowc">
  <span style="background:var(--status-draft-bg);color:var(--status-draft-fg);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);padding:4px 10px;font:var(--type-meta)">Nháp</span><span style="background:var(--status-review-bg);color:var(--status-review-fg);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);padding:4px 10px;font:var(--type-meta)">Chờ duyệt</span><span style="background:var(--status-published-bg);color:var(--status-published-fg);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);padding:4px 10px;font:var(--type-meta)">Đang hiển thị</span><span style="background:var(--status-closed-bg);color:var(--status-closed-fg);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);padding:4px 10px;font:var(--type-meta)">Đã đóng</span><span style="background:var(--status-expired-bg);color:var(--status-expired-fg);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);padding:4px 10px;font:var(--type-meta)">Hết hạn</span><span style="background:var(--status-takendown-bg);color:var(--status-takendown-fg);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);padding:4px 10px;font:var(--type-meta)">Đã hạ</span>
  </div><div class="cap">One vocabulary for all three actors. Only "Đã hạ" (taken down) is red; "Hết hạn" stays quiet on purpose.</div></div></body></html>
