<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px grid. --space-1 … --space-24." -->
<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);margin:0;padding:18px 20px;font:var(--type-body)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font:var(--type-meta);font-size:10px}.lg{display:grid;gap:10px}.rowc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tk{font:var(--type-mono);font-size:11px;color:var(--text-subtle)}.cap{font:var(--type-meta);color:var(--text-muted)}</style>
</head><body><div class="lg"><div style="display:flex;align-items:flex-end;gap:8px">
  <div style="text-align:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--pine-400);border-radius:2px;margin:0 auto"></div><div class="tk" style="margin-top:6px">1</div></div><div style="text-align:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--pine-400);border-radius:2px;margin:0 auto"></div><div class="tk" style="margin-top:6px">2</div></div><div style="text-align:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--pine-400);border-radius:2px;margin:0 auto"></div><div class="tk" style="margin-top:6px">3</div></div><div style="text-align:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--pine-400);border-radius:2px;margin:0 auto"></div><div class="tk" style="margin-top:6px">4</div></div><div style="text-align:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--pine-400);border-radius:2px;margin:0 auto"></div><div class="tk" style="margin-top:6px">5</div></div><div style="text-align:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--pine-400);border-radius:2px;margin:0 auto"></div><div class="tk" style="margin-top:6px">6</div></div><div style="text-align:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--pine-400);border-radius:2px;margin:0 auto"></div><div class="tk" style="margin-top:6px">8</div></div><div style="text-align:center"><div style="width:var(--space-10);height:var(--space-10);background:var(--pine-400);border-radius:2px;margin:0 auto"></div><div class="tk" style="margin-top:6px">10</div></div><div style="text-align:center"><div style="width:var(--space-12);height:var(--space-12);background:var(--pine-400);border-radius:2px;margin:0 auto"></div><div class="tk" style="margin-top:6px">12</div></div><div style="text-align:center"><div style="width:var(--space-16);height:var(--space-16);background:var(--pine-400);border-radius:2px;margin:0 auto"></div><div class="tk" style="margin-top:6px">16</div></div>
  </div><div class="cap">--space-2 (8px) inside controls, --space-3/4 inside cards, --space-6 between cards, --space-12+ between page sections.</div></div></body></html>
