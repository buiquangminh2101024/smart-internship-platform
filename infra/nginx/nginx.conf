events {}

http {
  # apps/server và apps/web chạy trên host qua `npm run dev:server` / `npm run dev:web`
  # (chưa containerize ở Phase 0). Port apps/server (4000) là giả định tạm thời — main.ts
  # hiện chưa listen port nào, sẽ được chốt khi Express app thật sự dựng ở Phase 1.
  upstream server_app {
    server host.docker.internal:4000;
  }

  upstream web_app {
    server host.docker.internal:3000;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://server_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
