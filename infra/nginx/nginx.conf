events {}

http {
  # apps/server và apps/web chạy trên host qua `npm run dev:server` / `npm run dev:web`
  # (chưa containerize). host.docker.internal có cả bản ghi IPv4 lẫn IPv6 trên
  # nhiều máy Docker Desktop — nếu dùng "server host.docker.internal:PORT;"
  # tĩnh, nginx cache cả hai lúc khởi động và có thể thử kết nối qua IPv6
  # trước, gây lỗi "Network unreachable" (địa chỉ IPv6 đó không định tuyến
  # được) trước khi tự fallback IPv4. Dùng `resolver` (DNS nội bộ của Docker,
  # 127.0.0.11) + biến trong proxy_pass để resolve tại request-time, ép chỉ
  # lấy IPv4 (ipv6=off) — tránh hẳn việc thử IPv6 hỏng đó.
  resolver 127.0.0.11 ipv6=off valid=30s;

  # Mặc định nginx chỉ nhận body 1MB. POST /employers/company gửi tối đa 3 file
  # (giấy phép + logo + banner), mỗi file ≤ 5MB theo multer — để dư cho các field text.
  client_max_body_size 16m;

  server {
    listen 80;

    # Phân tích CV bằng AI chạy đồng bộ trong request (Gemini → OpenRouter →
    # Tesseract), có thể quá 60s mặc định của nginx khi rơi xuống tầng dự phòng
    # — nới riêng route này (docs/06-backend/cv-ai-extraction-phase1/PLAN.md).
    location ~ ^/api/candidates/me/cvs/[^/]+/extract$ {
      set $server_upstream "http://host.docker.internal:4000";
      proxy_pass $server_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }

    location /api/ {
      set $server_upstream "http://host.docker.internal:4000";
      proxy_pass $server_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location / {
      set $web_upstream "http://host.docker.internal:3000";
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
